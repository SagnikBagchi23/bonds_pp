/* ── Base ── */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; }
body {
  background: var(--pageBg);
  color: var(--contentPrimary);
  font-family: var(--font-body);
  font-weight: 400;
  font-size: 14px;
  line-height: 20px;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
  overflow-x: hidden;
  display: flex;
  align-items: center;
  justify-content: center;
  min-height: 100vh;
}

/* ── iPhone 15 Pro Mockup ── */
.iphone-chassis {
  position: relative;
  flex-shrink: 0;
  width: 405px;
  height: 868px;
}

.iphone-frame {
  width: 100%;
  height: 100%;
  border-radius: 54px;
  background: var(--iphoneBody);
  position: relative;
  box-shadow:
    inset 0 0 0 1.5px var(--iphoneEdgeLight),
    0 0 0 2px var(--iphoneEdgeDark),
    0 20px 60px rgba(0,0,0,0.35),
    0 8px 20px rgba(0,0,0,0.2);
  overflow: hidden;
}

:root {
  --iphoneBody: #1A1A1E;
  --iphoneEdgeLight: rgba(255,255,255,0.12);
  --iphoneEdgeDark: #0A0A0C;
  --iphoneBezel: #0A0A0C;
  --iphoneBtnColor: #2A2A2E;
}

.iphone-screen-bezel {
  position: absolute;
  top: 6px; left: 6px; right: 6px; bottom: 6px;
  border-radius: 48px;
  background: var(--backgroundPrimary);
  overflow: hidden;
  z-index: 1;
}
.iphone-screen {
  width: 100%;
  height: 100%;
  overflow: hidden;
  position: relative;
  display: flex;
  flex-direction: column;
}

/* Dynamic Island */
.dynamic-island {
  position: absolute;
  top: 12px;
  left: 50%;
  transform: translateX(-50%);
  width: 120px;
  height: 36px;
  background: #000;
  border-radius: 20px;
  z-index: 20;
}
.dynamic-island::before {
  content: '';
  position: absolute;
  top: 50%;
  right: 16px;
  transform: translateY(-50%);
  width: 10px;
  height: 10px;
  border-radius: 50%;
  background: radial-gradient(circle at 40% 40%, #1a2a3a, #0a0f15);
  box-shadow: inset 0 0 2px rgba(255,255,255,0.08);
}

/* Side buttons */
.iphone-btn {
  position: absolute;
  background: var(--iphoneBtnColor);
  border-radius: 2px;
  z-index: 5;
}
.iphone-btn-silent {
  left: -3px;
  top: 160px;
  width: 3px;
  height: 28px;
  border-radius: 2px 0 0 2px;
}
.iphone-btn-volup {
  left: -3px;
  top: 210px;
  width: 3px;
  height: 48px;
  border-radius: 2px 0 0 2px;
}
.iphone-btn-voldn {
  left: -3px;
  top: 268px;
  width: 3px;
  height: 48px;
  border-radius: 2px 0 0 2px;
}
.iphone-btn-power {
  right: -3px;
  top: 230px;
  width: 3px;
  height: 80px;
  border-radius: 0 2px 2px 0;
}

/* Speaker grille */
.iphone-speaker {
  position: absolute;
  bottom: 16px;
  left: 50%;
  transform: translateX(-50%);
  display: flex;
  gap: 3px;
  z-index: 2;
}
.iphone-speaker-dot {
  width: 3px;
  height: 3px;
  border-radius: 50%;
  background: #333;
}

/* ── Gradient overlay ── */
.gradient-overlay {
  position: absolute;
  top: 0; left: 0; right: 0;
  height: var(--gradientHeight);
  background: linear-gradient(to bottom, var(--gradientStart), var(--backgroundPrimary));
  pointer-events: none;
  z-index: 0;
  transition: background 0.4s ease;
}

/* ── iOS Status Bar ── */
.ios-status-bar {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 14px 24px 0;
  height: 54px;
  position: relative;
  z-index: 15;
}
.ios-status-time {
  font-family: var(--font-heading);
  font-size: 15px;
  font-weight: 500;
  color: var(--contentPrimary);
  letter-spacing: 0.02em;
}
.ios-status-icons {
  display: flex;
  align-items: center;
  gap: 5px;
}
.ios-status-icons svg {
  width: 16px;
  height: 16px;
  fill: var(--contentPrimary);
}
.ios-status-battery {
  width: 25px;
  height: 12px;
  border: 1.5px solid var(--contentPrimary);
  border-radius: 3px;
  position: relative;
  display: flex;
  align-items: center;
  padding: 1.5px;
}
.ios-status-battery::after {
  content: '';
  position: absolute;
  right: -4px;
  top: 50%;
  transform: translateY(-50%);
  width: 2px;
  height: 5px;
  background: var(--contentPrimary);
  border-radius: 0 1px 1px 0;
}
.ios-battery-fill {
  width: 70%;
  height: 100%;
  background: var(--contentPrimary);
  border-radius: 1px;
}

/* ── Home Indicator ── */
.ios-home-indicator {
  width: 134px;
  height: 5px;
  background: var(--contentPrimary);
  border-radius: 3px;
  margin: 8px auto;
  opacity: 0.25;
}

/* ── Page content inside phone ── */
.page-wrap {
  position: relative;
  z-index: 1;
  padding-block: 0;
  padding-bottom: 16px;
  flex: 1;
  min-height: 0;
  overflow-y: auto;
  overflow-x: hidden;
}

/* ── App bar ── */
.app-bar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 44px 16px 12px;
  position: sticky;
  top: 0;
  z-index: 10;
}
.app-bar-icon {
  width: 40px;
  height: 40px;
  display: flex;
  align-items: center;
  justify-content: center;
  border-radius: 50%;
  color: var(--contentPrimary);
  cursor: pointer;
}
.app-bar-icon svg { width: 20px; height: 20px; }

/* ── Hero section ── */
.hero { padding: 8px 16px 20px; }
.issuer-logo {
  width: 48px;
  height: 48px;
  border-radius: 12px;
  object-fit: cover;
  background: var(--backgroundSurfaceZ1);
  border: 1px solid var(--borderPrimary);
}
.issuer-meta {
  margin-top: 12px;
  display: flex;
  align-items: center;
  gap: 6px;
}
.issuer-tag {
  font-family: var(--font-body);
  font-size: 12px;
  font-weight: 400;
  color: var(--contentSecondary);
  line-height: 18px;
}
.issuer-dot {
  width: 3px;
  height: 3px;
  border-radius: 50%;
  background: var(--contentTertiary);
}
.bond-name {
  font-family: var(--font-heading);
  font-size: 18px;
  font-weight: 500;
  color: var(--contentPrimary);
  margin-top: 4px;
  line-height: 28px;
  text-wrap: balance;
}
/* ── MDS Tag ── */
.mds-tag {
  display: inline-flex;
  align-items: center;
  gap: 2px;
  padding: 2px 8px 2px 4px;
  border-radius: 4px;
  font-family: var(--font-body);
  font-size: 12px;
  font-weight: 500;
  line-height: 18px;
  white-space: nowrap;
}
.mds-tag:empty, .mds-tag[data-variant="none"] { display: none; }
.mds-tag-icon {
  font-size: 12px;
  width: 12px;
  height: 12px;
  display: flex;
  align-items: center;
  justify-content: center;
}
.mds-tag[data-variant="new"]            { background: var(--bgDVSkyBlueSubtle);  color: var(--dvSkyBlueEmphasis); }
.mds-tag[data-variant="high-yield"]     { background: var(--bgDVOrangeSubtle);   color: var(--dvOrangeEmphasis); }
.mds-tag[data-variant="senior-secured"] { background: var(--bgDVMintGreenSubtle);color: var(--dvMintGreenEmphasis); }
.mds-tag[data-variant="tax-free"]       { background: var(--bgDVYellowSubtle);   color: var(--dvYellowEmphasis); }
.mds-tag[data-variant="monthly-income"] { background: var(--bgDVLilacSubtle);    color: var(--dvLilacEmphasis); }

/* ── Bond Card (Figma) ── */
.bond-card {
  margin: 16px;
  background: var(--backgroundSurfaceZ1);
  border: 1px solid var(--borderPrimary);
  border-radius: 16px;
  padding: 16px;
  display: flex;
  flex-direction: column;
  gap: 24px;
}
.card-top {
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
}
.card-ytm-block { display: flex; flex-direction: column; }
.card-ytm-header {
  display: flex;
  align-items: center;
  gap: 4px;
}
.card-ytm-label {
  font-family: var(--font-body);
  font-size: 14px;
  font-weight: 400;
  color: var(--contentSecondary);
  line-height: 20px;
}
.card-ytm-info {
  font-size: 12px;
  color: var(--contentSecondary);
  cursor: help;
}
.card-ytm-value {
  font-family: var(--font-heading);
  font-size: 28px;
  font-weight: 500;
  color: var(--contentPrimary);
  line-height: 36px;
  font-variant-numeric: tabular-nums;
}
.card-bottom {
  display: flex;
  flex-direction: column;
  gap: 16px;
}
.card-data-row {
  display: flex;
  gap: 16px;
}
.card-data-cell {
  flex: 1;
  min-width: 0;
  display: flex;
  flex-direction: column;
  gap: 2px;
}
.card-data-key {
  font-family: var(--font-body);
  font-size: 14px;
  font-weight: 400;
  color: var(--contentSecondary);
  line-height: 20px;
}
.card-data-val {
  font-family: var(--font-body);
  font-size: 16px;
  font-weight: 500;
  color: var(--contentPrimary);
  line-height: 24px;
  font-variant-numeric: tabular-nums;
}

/* ── Logo previews in DialKit dropdown ── */

/* ── CTA ── */
.cta-area {
  flex-shrink: 0;

/* ── Layout wrapper ── */

<script>

var FAMILIES = [
  { name: "Brown",      hue: 5,   token: "--bgDVBrownSubtle" },
  { name: "Red",        hue: 11,  token: "--bgDVRedSubtle" },

];
var GREY_FAMILY = { name: "Grey", token: "--bgDVGreySubtle" };

var FAMILY_COLORS = {
  Brown:"#9D615C", Red:"#FF5E3B", Orange:"#F59817", Yellow:"#FCCE00",
  OliveGreen:"#A1B55C", MintGreen:"#04B488", SkyBlue:"#4DA4DD",
  Blue:"#5669FF", Lilac:"#7A7AC6", Magenta:"#C73A75", Grey:"#808FA3"
};

// ── Color extraction ──
function extractDominantColor(imgSrc) {
  return new Promise(function(resolve) {
    var img = new Image();
    img.crossOrigin = "anonymous";
    img.onload = function() {
      var canvas = document.createElement("canvas");
      var SIZE = 50;
      canvas.width = SIZE; canvas.height = SIZE;
      var ctx = canvas.getContext("2d");
      ctx.drawImage(img, 0, 0, SIZE, SIZE);
      var data;
      try { data = ctx.getImageData(0, 0, SIZE, SIZE).data; } catch(e) { resolve(null); return; }
      var buckets = {}, totalPixels = 0, filteredPixels = 0;
      for (var i = 0; i < data.length; i += 4) {
        var r = data[i], g = data[i+1], b = data[i+2], a = data[i+3];
        totalPixels++;
        if (a < 128) continue;
        if (r > 240 && g > 240 && b > 240) continue;
        if (r < 15 && g < 15 && b < 15) continue;
        filteredPixels++;
        var key = (r >> 5) + "," + (g >> 5) + "," + (b >> 5);
        if (!buckets[key]) buckets[key] = { count: 0, rS: 0, gS: 0, bS: 0 };
        buckets[key].count++; buckets[key].rS += r; buckets[key].gS += g; buckets[key].bS += b;
      }
      var ratio = filteredPixels / totalPixels;
      if (ratio < 0.05) { resolve({ r: 0, g: 0, b: 0, ratio: ratio, tooFew: true }); return; }
      var best = null, keys = Object.keys(buckets);
      for (var k = 0; k < keys.length; k++) { var bk = buckets[keys[k]]; if (!best || bk.count > best.count) best = bk; }
      if (!best) { resolve(null); return; }
      resolve({ r: Math.round(best.rS / best.count), g: Math.round(best.gS / best.count), b: Math.round(best.bS / best.count), ratio: ratio, tooFew: false });
    };
    img.onerror = function() { resolve(null); };
    img.src = imgSrc;
  });
}

function rgbToHsl(r, g, b) {
  r /= 255; g /= 255; b /= 255;
  var max = Math.max(r, g, b), min = Math.min(r, g, b), l = (max + min) / 2;
  if (max === min) return { h: 0, s: 0, l: l };
  var d = max - min, s = l > 0.5 ? d / (2 - max - min) : d / (max + min), h;
  if (max === r) h = ((g - b) / d + (g < b ? 6 : 0)) / 6;
  else if (max === g) h = ((b - r) / d + 2) / 6;
  else h = ((r - g) / d + 4) / 6;
  return { h: h * 360, s: s, l: l };
}

function rgbToHex(r, g, b) {
  return "#" + [r,g,b].map(function(c) { return c.toString(16).padStart(2,"0"); }).join("");
}

function mapToFamily(rgb) {
  if (!rgb || rgb.tooFew) return { family: GREY_FAMILY, fallback: true, reason: "too few chromatic pixels" };
  var hsl = rgbToHsl(rgb.r, rgb.g, rgb.b);
  if (hsl.s < 0.12) return { family: GREY_FAMILY, fallback: true, reason: "low saturation (" + Math.round(hsl.s * 100) + "%)", hsl: hsl };
  if (hsl.l < 0.08) return { family: GREY_FAMILY, fallback: true, reason: "near-black (L=" + Math.round(hsl.l * 100) + "%)", hsl: hsl };
  if (hsl.l > 0.92) return { family: GREY_FAMILY, fallback: true, reason: "near-white (L=" + Math.round(hsl.l * 100) + "%)", hsl: hsl };
  if (hsl.l > 0.82 && hsl.s < 0.35) return { family: GREY_FAMILY, fallback: true, reason: "washed-out (L=" + Math.round(hsl.l * 100) + "%, S=" + Math.round(hsl.s * 100) + "%)", hsl: hsl };
  var closest = null, minDist = Infinity;
  for (var i = 0; i < FAMILIES.length; i++) {
    var dist = Math.min(Math.abs(hsl.h - FAMILIES[i].hue), 360 - Math.abs(hsl.h - FAMILIES[i].hue));
    if (dist < minDist) { minDist = dist; closest = FAMILIES[i]; }
  }
  return { family: closest, fallback: false, reason: "hue match (dist " + Math.round(minDist) + "°)", hsl: hsl };
}

function applyGradient(family) {
  document.documentElement.style.setProperty("--gradientStart", "var(" + family.token + ")");
}

});

var extraction = DialKit.createDialKit("Extraction", {

function selectLogo(name) {
  document.getElementById("heroLogo").src = "logos/" + name + ".png";
  document.getElementById("issuerName").textContent = name;
  document.getElementById("bondName").textContent = name + " NCD Tranche I";

  extractDominantColor("logos/" + name + ".png").then(function(rgb) {
    var result = mapToFamily(rgb);
    applyGradient(result.family);
    updateDebug(rgb, result);
  });
}

function applyTheme(theme) {
  if (theme === "dark") {
    document.documentElement.setAttribute("data-theme", "dark");
  } else if (theme === "light") {
    document.documentElement.setAttribute("data-theme", "light");
  } else {
    document.documentElement.removeAttribute("data-theme");
  }
}

function updateDebug(rgb, result) {
  var colorVal = "—";
  var hslVal = "—";

  if (!rgb || rgb.tooFew) {
    colorVal = rgb ? "filtered out" : "failed";
  } else {
    colorVal = rgbToHex(rgb.r, rgb.g, rgb.b);
    if (result.hsl) {
      hslVal = Math.round(result.hsl.h) + "° / " + Math.round(result.hsl.s * 100) + "% / " + Math.round(result.hsl.l * 100) + "%";
    }
  }

  var fam = result.family;
  extraction.setValues({ color: colorVal, hsl: hslVal, token: fam.token });
}

var TAG_CONFIG = {

// ── Logo previews in DialKit dropdown ──
function injectLogoPreviewsInDropdown() {
  var observer = new MutationObserver(function(mutations) {
    mutations.forEach(function(m) {
      m.addedNodes.forEach(function(node) {
        if (!(node instanceof HTMLElement)) return;
        var opts = node.querySelectorAll ? node.querySelectorAll(".dialkit-select-option") : [];
        if (node.classList && node.classList.contains("dialkit-select-option")) opts = [node];
        opts.forEach(function(opt) {
          if (opt.querySelector(".dk-logo-preview")) return;
          var text = opt.textContent.trim();
          if (LOGOS.indexOf(text) === -1) return;
          var img = document.createElement("img");
          img.className = "dk-logo-preview";
          img.src = "logos/" + text + ".png";
          img.alt = "";
          img.loading = "lazy";
          opt.insertBefore(img, opt.firstChild);
        });
      });
    });
  });
  observer.observe(document.body, { childList: true, subtree: true });
}
injectLogoPreviewsInDropdown();
