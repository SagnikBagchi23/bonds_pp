/* ── Base ── */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; }
body {
  background: var(--pageBg);
  color: var(--contentPrimary);
  font-family: var(--font-body);
  font-weight: 400;
  font-size: 14px;
  line-height: 20px;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
  overflow-x: hidden;
  display: flex;
  align-items: center;
  justify-content: center;
  min-height: 100vh;
}

/* ── iPhone Mockup Frame ── */
.iphone-frame {
  width: 393px;
  height: 852px;
  border: 2px solid var(--borderPrimary);
  border-radius: 48px;
  overflow: hidden;
  position: relative;
  flex-shrink: 0;
  background: var(--backgroundPrimary);
}
.iphone-notch {
  position: absolute;
  top: 0;
  left: 50%;
  transform: translateX(-50%);
  width: 126px;
  height: 34px;
  background: #000;
  border-radius: 0 0 20px 20px;
  z-index: 20;
}
.iphone-screen {
  width: 100%;
  height: 100%;
  overflow-y: auto;
  overflow-x: hidden;
  position: relative;
}

/* ── Gradient overlay ── */
.gradient-overlay {
  position: absolute;
  top: 0; left: 0; right: 0;
  height: var(--gradientHeight);
  background: linear-gradient(to bottom, var(--gradientStart), var(--backgroundPrimary));
  pointer-events: none;
  z-index: 0;
  transition: background 0.4s ease;
}

/* ── Page content inside phone ── */
.page-wrap {
  position: relative;
  z-index: 1;
  padding-block: 0;
}

/* ── App bar ── */
.app-bar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 44px 16px 12px;
  position: sticky;
  top: 0;
  z-index: 10;
}
.app-bar-icon {
  width: 40px;
  height: 40px;
  display: flex;
  align-items: center;
  justify-content: center;
  border-radius: 50%;
  color: var(--contentPrimary);
  cursor: pointer;
}
.app-bar-icon svg { width: 20px; height: 20px; }

/* ── Hero section ── */
.hero { padding: 8px 16px 20px; }
.issuer-logo {
  width: 48px;
  height: 48px;
  border-radius: 12px;
  object-fit: cover;
  background: var(--backgroundSurfaceZ1);
  border: 1px solid var(--borderPrimary);
}
.issuer-meta {
  margin-top: 12px;
  display: flex;
  align-items: center;
  gap: 6px;
}
.issuer-tag {
  font-family: var(--font-body);
  font-size: 12px;
  font-weight: 400;
  color: var(--contentSecondary);
  line-height: 18px;
}
.issuer-dot {
  width: 3px;
  height: 3px;
  border-radius: 50%;
  background: var(--contentTertiary);
}
.bond-name {
  font-family: var(--font-heading);
  font-size: 18px;
  font-weight: 500;
  color: var(--contentPrimary);
  margin-top: 4px;
  line-height: 28px;
  text-wrap: balance;
}
.custom-tag {
  display: inline-block;
  margin-top: 8px;
  padding: 2px 8px;
  border-radius: 6px;
  background: var(--backgroundAccentSubtle);
  color: var(--contentAccent);
  font-family: var(--font-body);
  font-size: 12px;
  font-weight: 500;
  line-height: 18px;
}
.custom-tag:empty { display: none; }
.yield-row {
  margin-top: 16px;
  display: flex;
  align-items: baseline;
  gap: 8px;
}
.yield-value {
  font-family: var(--font-heading);
  font-size: 20px;
  font-weight: 500;
  color: var(--contentPrimary);
  line-height: 32px;
  font-variant-numeric: tabular-nums;
}
.yield-label {
  font-family: var(--font-body);
  font-size: 14px;
  font-weight: 400;
  color: var(--contentSecondary);
  line-height: 20px;
}
.yield-badge {
  margin-top: 6px;
  display: inline-flex;
  align-items: center;
  gap: 4px;
  font-family: var(--font-body);
  font-size: 12px;
  font-weight: 500;
  color: var(--contentPositive);
  font-variant-numeric: tabular-nums;
  line-height: 18px;
}
.yield-badge-period {
  color: var(--contentSecondary);
  font-weight: 400;
  margin-left: 4px;
}

/* ── Details card ── */
.details-card {
  margin: 16px;
  background: var(--backgroundSurfaceZ1);
  border: 1px solid var(--borderPrimary);
  border-radius: 16px;
  overflow: hidden;
}
.detail-row {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 14px 16px;
}
.detail-row + .detail-row {
  border-top: 1px solid var(--borderPrimary);
}
.detail-label {
  font-family: var(--font-body);
  font-size: 14px;
  font-weight: 400;
  color: var(--contentSecondary);
  line-height: 20px;
}
.detail-value {
  font-family: var(--font-body);
  font-size: 14px;
  font-weight: 500;
  color: var(--contentPrimary);
  font-variant-numeric: tabular-nums;
  text-align: right;
  line-height: 20px;
}
.rating-chip {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  padding: 2px 8px;
  border-radius: 6px;
  background: var(--backgroundAccentSubtle);
  color: var(--contentAccent);
  font-family: var(--font-body);
  font-size: 12px;
  font-weight: 500;
  line-height: 18px;
}

/* ── CTA ── */
.cta-area {
  padding: 16px;
  position: sticky;
  bottom: 0;
  z-index: 10;
}
.cta-btn {
  width: 100%;
  padding: 14px;
  border: none;
  border-radius: 12px;
  background: var(--backgroundAccent);
  color: var(--contentOnColour);
  font-family: var(--font-heading);
  font-size: 16px;
  font-weight: 500;
  cursor: pointer;
  line-height: 24px;
}

/* ── Debug overlay on mockup ── */
.debug-overlay {
  position: absolute;
  bottom: 8px;
  left: 8px;
  right: 8px;
  z-index: 30;
  background: rgba(0,0,0,0.75);
  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);
  border-radius: 10px;
  padding: 8px 10px;
  display: flex;
  flex-direction: column;
  gap: 4px;
  font-family: var(--font-heading);
  font-size: 11px;
  font-weight: 500;
  color: rgba(255,255,255,0.85);
  font-variant-numeric: tabular-nums;
  pointer-events: none;
}
.debug-overlay .dbg-row {
  display: flex;
  justify-content: space-between;
}
.debug-overlay .dbg-label { opacity: 0.5; }
.debug-overlay .dbg-val { display: flex; align-items: center; gap: 4px; }
.debug-overlay .dbg-swatch {
  width: 10px; height: 10px; border-radius: 3px;
  border: 1px solid rgba(255,255,255,0.2);
}
.debug-overlay .dbg-chip {
  padding: 1px 6px;
  border-radius: 3px;
  font-size: 10px;
}
.debug-overlay .dbg-fallback {
  color: #FCCE00;
  font-size: 10px;
  text-transform: uppercase;
  letter-spacing: 0.05em;
}

/* ── Responsive ── */
@media (max-width: 500px) {
  .iphone-frame {
    width: 100%;
    max-width: 393px;
    height: 750px;
    border-radius: 0;
    border-left: none;

  { name: "Orange",     hue: 34,  token: "--bgDVOrangeSubtle" },

  { name: "SkyBlue",    hue: 205, token: "--bgDVSkyBlueSubtle" },
  { name: "Blue",       hue: 233, token: "--bgDVBlueSubtle" },
  { name: "Lilac",      hue: 240, token: "--bgDVLilacSubtle" },
  { name: "Magenta",    hue: 333, token: "--bgDVMagentaSubtle" },
];
var GREY_FAMILY = { name: "Grey", token: "--bgDVGreySubtle" };

var FAMILY_COLORS = {
  Brown:"#9D615C", Red:"#FF5E3B", Orange:"#F59817", Yellow:"#FCCE00",
  OliveGreen:"#A1B55C", MintGreen:"#04B488", SkyBlue:"#4DA4DD",
  Blue:"#5669FF", Lilac:"#7A7AC6", Magenta:"#C73A75", Grey:"#808FA3"
};

// ── Color extraction ──
function extractDominantColor(imgSrc) {
  return new Promise(function(resolve) {
    var img = new Image();
    img.crossOrigin = "anonymous";
    img.onload = function() {
      var canvas = document.createElement("canvas");
      var SIZE = 50;
      canvas.width = SIZE; canvas.height = SIZE;
      var ctx = canvas.getContext("2d");
      ctx.drawImage(img, 0, 0, SIZE, SIZE);
      var data;
      try { data = ctx.getImageData(0, 0, SIZE, SIZE).data; } catch(e) { resolve(null); return; }
      var buckets = {}, totalPixels = 0, filteredPixels = 0;
      for (var i = 0; i < data.length; i += 4) {
        var r = data[i], g = data[i+1], b = data[i+2], a = data[i+3];
        totalPixels++;
        if (a < 128) continue;
        if (r > 240 && g > 240 && b > 240) continue;
        if (r < 15 && g < 15 && b < 15) continue;
        filteredPixels++;
        var key = (r >> 5) + "," + (g >> 5) + "," + (b >> 5);
        if (!buckets[key]) buckets[key] = { count: 0, rS: 0, gS: 0, bS: 0 };
        buckets[key].count++; buckets[key].rS += r; buckets[key].gS += g; buckets[key].bS += b;
      }
      var ratio = filteredPixels / totalPixels;
      if (ratio < 0.05) { resolve({ r: 0, g: 0, b: 0, ratio: ratio, tooFew: true }); return; }
      var best = null, keys = Object.keys(buckets);
      for (var k = 0; k < keys.length; k++) { var bk = buckets[keys[k]]; if (!best || bk.count > best.count) best = bk; }
      if (!best) { resolve(null); return; }
      resolve({ r: Math.round(best.rS / best.count), g: Math.round(best.gS / best.count), b: Math.round(best.bS / best.count), ratio: ratio, tooFew: false });
    };
    img.onerror = function() { resolve(null); };
    img.src = imgSrc;
  });
}

function rgbToHsl(r, g, b) {
  r /= 255; g /= 255; b /= 255;
  var max = Math.max(r, g, b), min = Math.min(r, g, b), l = (max + min) / 2;
  if (max === min) return { h: 0, s: 0, l: l };
  var d = max - min, s = l > 0.5 ? d / (2 - max - min) : d / (max + min), h;
  if (max === r) h = ((g - b) / d + (g < b ? 6 : 0)) / 6;
  else if (max === g) h = ((b - r) / d + 2) / 6;
  else h = ((r - g) / d + 4) / 6;
  return { h: h * 360, s: s, l: l };
}

function rgbToHex(r, g, b) {
  return "#" + [r,g,b].map(function(c) { return c.toString(16).padStart(2,"0"); }).join("");
}

function mapToFamily(rgb) {
  if (!rgb || rgb.tooFew) return { family: GREY_FAMILY, fallback: true, reason: "too few chromatic pixels" };
  var hsl = rgbToHsl(rgb.r, rgb.g, rgb.b);
  if (hsl.s < 0.12) return { family: GREY_FAMILY, fallback: true, reason: "low saturation (" + Math.round(hsl.s * 100) + "%)", hsl: hsl };
  if (hsl.l < 0.08) return { family: GREY_FAMILY, fallback: true, reason: "near-black (L=" + Math.round(hsl.l * 100) + "%)", hsl: hsl };
  if (hsl.l > 0.92) return { family: GREY_FAMILY, fallback: true, reason: "near-white (L=" + Math.round(hsl.l * 100) + "%)", hsl: hsl };
  if (hsl.l > 0.82 && hsl.s < 0.35) return { family: GREY_FAMILY, fallback: true, reason: "washed-out (L=" + Math.round(hsl.l * 100) + "%, S=" + Math.round(hsl.s * 100) + "%)", hsl: hsl };
  var closest = null, minDist = Infinity;
  for (var i = 0; i < FAMILIES.length; i++) {
    var dist = Math.min(Math.abs(hsl.h - FAMILIES[i].hue), 360 - Math.abs(hsl.h - FAMILIES[i].hue));
    if (dist < minDist) { minDist = dist; closest = FAMILIES[i]; }
  }
  return { family: closest, fallback: false, reason: "hue match (dist " + Math.round(minDist) + "°)", hsl: hsl };
}

function applyGradient(family) {
  document.documentElement.style.setProperty("--gradientStart", "var(" + family.token + ")");
}

// ── DialKit setup ──
var dialRoot = DialKit.createDialRoot({
  position: "top-right",
  defaultOpen: true,
  theme: "system"
});
document.body.appendChild(dialRoot.element);

var logoOptions = LOGOS.map(function(name) {
  return { value: name, label: name };
});

var dial = DialKit.createDialKit("Gradient Tester", {
  theme: {
    type: "select",
    options: [
      { value: "light", label: "Light" },
      { value: "system", label: "System" },
      { value: "dark", label: "Dark" }
    ],
    default: "system"
  },
  issuer: {
    type: "select",
    options: logoOptions,
    default: "Aye Finance"
  },
  tag: {
    type: "text",
    default: "",
    placeholder: "e.g. High Yield, AA+ Rated"
  },
  gradientHeight: [20, 5, 40, 1]
});

function selectLogo(name) {
  document.getElementById("heroLogo").src = "logos/" + name + ".png";
  document.getElementById("issuerName").textContent = name;
  document.getElementById("bondName").textContent = name + " NCD Tranche I";

  extractDominantColor("logos/" + name + ".png").then(function(rgb) {
    var result = mapToFamily(rgb);
    applyGradient(result.family);
    updateDebug(rgb, result);
  });
}

function applyTheme(theme) {
  if (theme === "dark") {
    document.documentElement.setAttribute("data-theme", "dark");
  } else if (theme === "light") {
    document.documentElement.setAttribute("data-theme", "light");
  } else {
    document.documentElement.removeAttribute("data-theme");
  }
}

function updateDebug(rgb, result) {
  var dbgHex = document.getElementById("dbgHex");
  var dbgSwatch = document.getElementById("dbgSwatch");
  var dbgHSL = document.getElementById("dbgHSL");
  var dbgFamily = document.getElementById("dbgFamily");
  var dbgToken = document.getElementById("dbgToken");
  var dbgStatus = document.getElementById("dbgStatus");

  if (!rgb || rgb.tooFew) {
    dbgHex.textContent = rgb ? "filtered out" : "failed";
    dbgSwatch.style.background = "#808FA3";
    dbgHSL.textContent = "—";
  } else {
    var hex = rgbToHex(rgb.r, rgb.g, rgb.b);
    dbgHex.textContent = hex;
    dbgSwatch.style.background = hex;
    if (result.hsl) {
      dbgHSL.textContent = Math.round(result.hsl.h) + "° / " + Math.round(result.hsl.s * 100) + "% / " + Math.round(result.hsl.l * 100) + "%";
    }
  }

  var fam = result.family;
  dbgFamily.textContent = fam.name;
  dbgFamily.style.background = FAMILY_COLORS[fam.name] + "33";
  dbgFamily.style.color = FAMILY_COLORS[fam.name];
  dbgToken.textContent = fam.token;

  if (result.fallback) {
    dbgStatus.innerHTML = '<span class="dbg-fallback">Fallback</span> ' + result.reason;
  } else {
    dbgStatus.textContent = result.reason;
  }
}

dial.subscribe(function(values) {
  applyTheme(values.theme);
  selectLogo(values.issuer);
  document.getElementById("customTag").textContent = values.tag || "";
  document.documentElement.style.setProperty("--gradientHeight", values.gradientHeight + "vh");
});

// Initial
selectLogo("Aye Finance");
</script>
